<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG文档助手 - 后台管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 24px;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #667eea;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .nav-links a:hover {
            background: #f0f0ff;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            background: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: #667eea;
            color: white;
        }
        
        .tab:hover:not(.active) {
            background: #f5f5f5;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .card h3 {
            color: #333;
            margin-top: 20px;
            margin-bottom: 16px;
            font-size: 16px;
        }
        
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .upload-area .icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 16px;
        }
        
        .upload-area .text {
            color: #666;
            font-size: 16px;
        }
        
        .upload-area .hint {
            color: #999;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #5a6fd6;
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: #28a745;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            background: white;
        }
        
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .model-select-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .model-select-wrapper select {
            flex: 1;
        }
        
        .btn-small {
            padding: 12px 16px;
            font-size: 14px;
        }
        
        .model-hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-bar .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            display: none;
        }

        .progress-text.show {
            display: block;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .config-display {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #333;
            white-space: pre-wrap;
        }
        
        .uploaded-files {
            margin-top: 20px;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .file-item .name {
            color: #333;
        }
        
        .file-item .chunks {
            color: #666;
            font-size: 14px;
        }

        .file-item .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-download {
            background: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-download:hover {
            background: #0056b3;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            margin-left: 8px;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .btn-delete:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-meta {
            color: #999;
            font-size: 12px;
        }
        
        .test-result {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            display: none;
        }
        
        .test-result.show {
            display: block;
        }
        
        .test-result.success {
            border-color: #28a745;
            background: #d4edda;
        }
        
        .test-result.error {
            border-color: #dc3545;
            background: #f8d7da;
        }
        
        .test-result .label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .test-result .content {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .test-loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .test-loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RAG文档助手管理系统</h1>
            <div class="nav-links">
                <a href="/">用户搜索页面</a>
                <a href="/admin">后台管理</a>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('upload')">文件上传</button>
            <button class="tab" onclick="showTab('manage')">文件管理</button>
            <button class="tab" onclick="showTab('config')">系统配置</button>
        </div>
        
        <div id="upload-tab" class="card">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
                <h2>上传文档</h2>
                <label for="enable-summary" style="font-size: 14px; color: #666; font-weight: normal;">生成文档总结<input type="checkbox" id="enable-summary" style="margin-left: 4px;"></label>
            </div>
            
            <div class="upload-area" id="upload-area">
                <div class="icon">📁</div>
                <div class="text">点击或拖拽文件到此处上传</div>
                <div class="hint">支持格式: .txt, .pdf, .docx, .doc, .xlsx, .xls, .csv</div>
                <input type="file" id="file-input" accept=".txt,.pdf,.docx,.doc,.xlsx,.xls,.csv">
            </div>
            
            <div class="alert" id="upload-alert"></div>
            <div class="progress-bar" id="upload-progress">
                <div class="progress" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text"></div>
        </div>
        
        <div id="manage-tab" class="card" style="display: none;">
            <h2>文件管理</h2>
            <div class="alert" id="manage-alert"></div>
            
            <div class="uploaded-files" id="uploaded-files"></div>
        </div>
        
        <div id="config-tab" class="card" style="display: none;">
            <h2>系统配置</h2>
            <div class="alert" id="config-alert"></div>
            
            <h3>大模型配置</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>API地址</label>
                    <input type="text" id="llm_api_base" placeholder="http://localhost:11434/v1">
                </div>
                <div class="form-group">
                    <label>API密钥</label>
                    <input type="text" id="llm_api_key" placeholder="ollama">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>模型名称</label>
                    <div class="model-select-wrapper">
                        <input type="text" id="llm_model_name" list="model-list" placeholder="输入模型名称或从下方选择...">
                        <datalist id="model-list">
                        </datalist>
                        <button class="btn btn-small" onclick="refreshModels()">🔄</button>
                    </div>
                    <div class="model-hint" id="model-hint"></div>
                </div>
                <div class="form-group">
                    <label>返回结果数量 (Top K)</label>
                    <input type="number" id="top_k" min="1" max="10" value="3">
                </div>
            </div>
            
            <div class="form-group">
                <label>温度参数 (Temperature)</label>
                <input type="number" id="temperature" step="0.1" min="0" max="1" value="0.7">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="saveConfig()">保存配置</button>
                <button class="btn btn-success" onclick="testModel()">测试模型连接</button>
                <button class="btn btn-secondary" onclick="useLocalModel()">使用本地模型</button>
            </div>
            
            <div class="test-loading" id="test-loading">
                <div class="spinner"></div>
                <div>正在连接模型...</div>
            </div>
            
            <div class="test-result" id="test-result"></div>
            
            <h3>当前配置</h3>
            <div class="config-display" id="current-config"></div>
        </div>
    </div>

    <script>
        // API_BASE: 后端API基础地址，所有请求都基于此地址
        const API_BASE = '/api';

        // 【调用者】用户点击标签页时（HTML onclick="showTab('tabName')"）
        // 【功能】切换显示的标签页内容
        
        // 【参数】tabName: 标签页名称（config/manage/vector）
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.card').forEach(c => c.style.display = 'none');

            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').style.display = 'block';

            if (tabName === 'config') {             // 切换到配置页：加载模型列表和配置
                loadModels();
                loadConfig();
            }

            if (tabName === 'manage') {             // 切换到管理页：加载文件列表
                loadUploadedFiles();
            }
        }

        // 【调用者】showTab()、页面加载完成时
        // 【功能】从后端获取已上传文件列表并渲染到页面
        // 【调用API】GET /api/uploaded-files
        // 【返回数据】{success, files: [{filename, size, size_formatted, chunks, upload_date}]}
        async function loadUploadedFiles() {
            try {
                const response = await fetch(`${API_BASE}/uploaded-files`);

                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                
                const result = await response.json();
                const container = document.getElementById('uploaded-files');   // 获取文件列表容器
                container.innerHTML = '';

                if (!result.success) {                     // 加载失败
                    container.innerHTML = `<div style="color: #dc3545; text-align: center; padding: 20px;">加载失败: ${result.error || '未知错误'}</div>`;
                    return;
                }

                if (!result.files || result.files.length === 0) {             // 空列表
                    container.innerHTML = '<div style="color: #666; text-align: center; padding: 20px;">暂无已上传的文件</div>';
                    return;
                }

                result.files.forEach(file => {             // 遍历文件列表
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    const fileInfo = document.createElement('div');
                    fileInfo.className = 'file-info';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'name';
                    nameSpan.textContent = '📄 ' + file.filename;           // 文件名
                    
                    const metaSpan = document.createElement('span');
                    metaSpan.className = 'file-meta';
                    metaSpan.textContent = file.size_formatted + ' · ' + file.chunks + ' 个片段';  // 文件大小和片段数
                    
                    fileInfo.appendChild(nameSpan);
                    fileInfo.appendChild(metaSpan);
                    
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'actions';
                    
                    // 下载按钮
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'btn-download';
                    downloadBtn.textContent = '下载';
                    downloadBtn.addEventListener('click', () => downloadFile(file.filename));  // 绑定下载事件
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = '删除';
                    deleteBtn.addEventListener('click', () => deleteFile(file.filename, deleteBtn));  // 绑定删除事件
                    
                    actionsDiv.appendChild(downloadBtn);
                    actionsDiv.appendChild(deleteBtn);
                    fileItem.appendChild(fileInfo);
                    fileItem.appendChild(actionsDiv);
                    
                    container.appendChild(fileItem);
                });
            } catch (error) {
                console.error('加载文件列表失败:', error);
                const container = document.getElementById('uploaded-files');
                container.innerHTML = `<div style="color: #dc3545; text-align: center; padding: 20px;">加载文件列表失败: ${error.message}</div>`;
            }
        }

        // 【调用者】文件列表中的下载按钮（loadUploadedFiles()中绑定）
        // 【功能】下载指定文件
        // 【调用API】GET /api/files/{encodedFilename}
        // 【参数】filename: 要下载的文件名
        function downloadFile(filename) {
            const encodedFilename = encodeURIComponent(filename);
            const url = `${API_BASE}/files/${encodedFilename}`;
            
            // 创建临时链接进行下载
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 【调用者】文件列表中的删除按钮（loadUploadedFiles()中绑定）
        // 【功能】删除指定文件及其在向量数据库中的数据
        // 【调用API】DELETE /api/files/{encodedFilename}
        // 【参数】filename: 要删除的文件名；btn: 删除按钮元素（用于状态更新）
        async function deleteFile(filename, btn) {
            const originalText = btn.textContent;          // 保存原始按钮文本
            
            if (!confirm(`确定要删除文件 "${filename}" 吗？删除后将同时删除向量数据库中的数据，此操作不可恢复。`)) {
                return;                                    // 用户取消删除
            }

            btn.disabled = true;                          // 禁用按钮
            btn.textContent = '删除中...';

            try {
                const encodedFilename = encodeURIComponent(filename);  // URL编码文件名
                const response = await fetch(`${API_BASE}/files/${encodedFilename}`, {
                    method: 'DELETE'                      // 发送删除请求
                });
                
                if (response.ok) {
                    const fileItem = btn.closest('.file-item');
                    if (fileItem) {
                        fileItem.remove();                 // 移除DOM元素
                    }
                    await loadUploadedFiles();             // 刷新文件列表
                    showAlert('manage-alert', 'success', `文件 ${filename} 删除成功，向量数据库中的相关数据已同步删除`);
                } else {
                    let errorMsg = '删除失败';
                    try {
                        const result = await response.json();
                        errorMsg = result.detail || errorMsg;
                    } catch (e) {}
                    throw new Error(errorMsg);
                }
            } catch (error) {
                console.error('删除失败:', error);
                showAlert('manage-alert', 'error', '删除失败: ' + error.message);
            } finally {
                btn.disabled = false;                     // 恢复按钮状态
                btn.textContent = originalText;
            }
        }

        // 【调用者】各业务函数（deleteFile、uploadFile等）
        // 【功能】显示提示消息，3秒后自动隐藏
        // 【参数】alertId: 提示框元素ID；type: 提示类型（success/error）；message: 提示内容
        function showAlert(alertId, type, message) {
            const alert = document.getElementById(alertId);   // 获取提示框元素
            alert.className = `alert ${type}`;              // 设置提示类型样式
            alert.textContent = message;                    // 设置提示内容
            alert.style.display = 'block';                  // 显示提示
            
            setTimeout(() => {
                alert.style.display = 'none';               // 3秒后自动隐藏
            }, 3000);
        }
        
        // 【调用者】文件选择input change事件、拖拽drop事件
        // 【功能】上传文件到服务器，通过SSE接收实时处理进度
        // 【调用API】POST /api/upload（使用FormData，enctype="multipart/form-data"）
        // 【参数】file: File对象（来自input或拖拽事件）
        // 【进度事件】{progress: 0-100, status: uploading/processing/storing/completed/failed, message: 状态描述}
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);                   // 创建表单数据
            
            // 获取是否生成总结的勾选状态
            const enableSummary = document.getElementById('enable-summary').checked;
            formData.append('enable_summary', enableSummary ? 'true' : 'false');
            
            const alert = document.getElementById('upload-alert');
            const progressBar = document.getElementById('upload-progress');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            
            // 重置UI状态
            alert.className = 'alert';
            alert.style.display = 'none';
            progressBar.classList.remove('show');
            progressFill.style.width = '0%';
            progressText.classList.remove('show');
            progressText.textContent = '';
            
            progressBar.classList.add('show');                // 显示进度条
            progressText.classList.add('show');
            
            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData                           // 发送上传请求
                });
                
                if (!response.ok) {
                    throw new Error('上传请求失败');
                }
                
                const reader = response.body.getReader();     // 使用SSE接收实时进度
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    
                    while (buffer.includes('\n\n')) {
                        const index = buffer.indexOf('\n\n');
                        const eventData = buffer.substring(0, index);
                        buffer = buffer.substring(index + 2);
                        
                        if (eventData.startsWith('data: ')) {
                            const jsonStr = eventData.substring(6);
                            try {
                                const progress = JSON.parse(jsonStr);
                                
                                progressFill.style.width = `${progress.progress}%`;  // 更新进度条
                                progressText.textContent = `${progress.message} - ${progress.progress}%`;
                                
                                if (progress.status === 'completed') {             // 上传完成
                                    alert.className = 'alert success';
                                    alert.textContent = progress.message;
                                    alert.style.display = 'block';
                                    loadUploadedFiles();
                                } else if (progress.status === 'failed') {         // 上传失败
                                    alert.className = 'alert error';
                                    alert.textContent = progress.message;
                                    alert.style.display = 'block';
                                }
                            } catch (e) {
                                console.error('解析进度数据失败:', e);
                            }
                        }
                    }
                }
                
            } catch (error) {
                alert.className = 'alert error';
                alert.textContent = '上传失败: ' + error.message;
                alert.style.display = 'block';
                progressFill.style.width = '0%';
                progressText.textContent = '';
            }
        }

        // 【调用者】uploadFile()（预留的轮询方案，当前使用SSE）
        // 【功能】轮询上传任务状态并更新进度条（当前被SSE方案替代）
        // 【调用API】GET /api/upload/task/{taskId}
        // 【参数】taskId: 任务ID；filename: 文件名
        // 【状态】pending/uploading/processing/storing/completed/failed
        async function pollTaskStatus(taskId, filename) {
            const alert = document.getElementById('upload-alert');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            
            const statusMap = {                              // 状态映射表
                'pending': '等待处理...',
                'uploading': '正在上传...',
                'processing': '正在解析文档...',
                'storing': '正在生成向量...',
                'completed': '处理完成',
                'failed': '处理失败'
            };
            
            let attempts = 0;
            const maxAttempts = 300;                        // 最多轮询300次
            
            while (attempts < maxAttempts) {
                try {
                    const response = await fetch(`${API_BASE}/upload/task/${taskId}`);  // 查询任务状态
                    const result = await response.json();
                    
                    if (response.ok) {
                        const status = result.status;
                        const progress = result.progress || 0;
                        const chunksCount = result.chunks_count || 0;
                        
                        progressFill.style.width = `${progress}%`;             // 更新进度条
                        let statusText = statusMap[status] || status;
                        progressText.textContent = `${statusText} - ${progress}%`;
                        
                        if (status === 'completed') {                          // 任务完成
                            alert.className = 'alert success';
                            alert.textContent = `文件 ${filename} 处理完成，切分了 ${chunksCount} 个片段`;
                            progressText.textContent = `处理完成 - 100%`;
                            loadUploadedFiles();
                            break;
                        } else if (status === 'failed') {                      // 任务失败
                            alert.className = 'alert error';
                            alert.textContent = `文件处理失败: ${result.error || '未知错误'}`;
                            break;
                        }
                    }
                } catch (error) {
                    console.error('轮询任务状态失败:', error);
                }
                
                attempts++;
                await new Promise(resolve => setTimeout(resolve, 800));        // 每800ms轮询一次
            }
            
            if (attempts >= maxAttempts) {                  // 超时处理
                alert.className = 'alert error';
                alert.textContent = '任务超时，请检查服务器状态';
            }
        }
        
        // 【调用者】uploadFile()中上传完成时（预留，当前loadUploadedFiles()已替代）
        // 【功能】动态添加文件项到文件列表DOM
        // 【参数】filename: 文件名；chunksCount: 片段数量
        function addFileToList(filename, chunksCount) {
            const container = document.getElementById('uploaded-files');   // 获取文件列表容器
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            
            const fileInfo = document.createElement('div');
            fileInfo.className = 'file-info';
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            nameSpan.textContent = '📄 ' + filename;                     // 文件名
            
            const metaSpan = document.createElement('span');
            metaSpan.className = 'file-meta';
            metaSpan.textContent = chunksCount + ' 个片段';               // 片段数
            
            fileInfo.appendChild(nameSpan);
            fileInfo.appendChild(metaSpan);
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'actions';
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-delete';
            deleteBtn.textContent = '删除';
            deleteBtn.addEventListener('click', () => deleteFile(filename, deleteBtn));  // 绑定删除事件
            
            actionsDiv.appendChild(deleteBtn);
            fileItem.appendChild(fileInfo);
            fileItem.appendChild(actionsDiv);
            
            container.appendChild(fileItem);
        }
        
        // 【调用者】文件选择input（HTML change事件）
        // 【功能】用户选择文件后自动触发上传
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                uploadFile(file);                           // 上传选中的文件
            }
        });
        
        // 【调用者】上传区域（HTML drag/drop事件）
        // 【功能】处理拖拽文件到上传区域的事件
        const uploadArea = document.getElementById('upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');            // 添加拖拽样式
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');         // 移除拖拽样式
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                uploadFile(file);                           // 上传拖拽的文件
            }
        });
        
        // 【调用者】配置页"使用本地模型"按钮（HTML onclick="useLocalModel()"）
        // 【功能】获取本地Ollama模型列表，自动填充API配置
        // 【调用API】GET /api/ollama/models
        // 【填充】llm_api_base=http://localhost:11434/v1；llm_api_key=ollama；llm_model_name=第一个模型
        async function useLocalModel() {
            const alert = document.getElementById('config-alert');  // 获取提示框
            
            try {
                const response = await fetch(`${API_BASE}/ollama/models`);  // 获取本地模型列表
                const result = await response.json();
                
                if (result.success && result.models && result.models.length > 0) {
                    document.getElementById('llm_api_base').value = 'http://localhost:11434/v1';  // 设置API地址
                    document.getElementById('llm_api_key').value = 'ollama';                      // 设置密钥
                    document.getElementById('llm_model_name').value = result.models[0].name;      // 设置模型名
                    
                    alert.className = 'alert success';
                    alert.textContent = `已加载本地模型: ${result.models[0].name}`;
                    alert.style.display = 'block';
                } else {
                    alert.className = 'alert error';
                    alert.textContent = '未找到本地模型，请确保Ollama已启动并已下载模型';
                    alert.style.display = 'block';
                }
            } catch (error) {
                alert.className = 'alert error';
                // 提醒用户检查Ollama服务是否已启动
                alert.textContent = '连接Ollama失败: ' + error.message;
                alert.style.display = 'block';
            }
        }

        // 【调用者】showTab('config')切换到配置页时
        // 【功能】加载线上模型列表和本地Ollama模型列表，填充到模型选择下拉框
        // 【调用API】GET /api/models（线上）；GET /api/ollama/models（本地）
        // 【填充】model-list datalist元素
        async function loadModels() {
            const datalist = document.getElementById('model-list');   // 获取模型列表datalist
            const hint = document.getElementById('model-hint');       // 获取提示元素
            
            datalist.innerHTML = '';                                 // 清空现有选项
            
            try {
                const onlineResponse = await fetch(`${API_BASE}/models`);  // 获取线上模型列表
                const onlineResult = await onlineResponse.json();
                
                let ollamaModels = [];
                try {
                    const ollamaResponse = await fetch(`${API_BASE}/ollama/models`);  // 获取本地模型列表
                    const ollamaResult = await ollamaResponse.json();
                    if (ollamaResult.success) {
                        ollamaModels = ollamaResult.models;
                    }
                } catch (e) {
                    console.log('Ollama不可用，跳过');
                }
                
                const allModels = new Set();                         // 用Set去重
                
                if (onlineResult.success && onlineResult.models) {
                    Object.entries(onlineResult.models).forEach(([provider, info]) => {
                        info.models.forEach(model => {
                            allModels.add(model);                    // 添加线上模型
                        });
                    });
                }
                
                ollamaModels.forEach(ollamaModel => {
                    allModels.add(ollamaModel.name);                 // 添加本地模型
                });
                
                allModels.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    datalist.appendChild(option);                    // 添加到datalist
                });
                
                hint.textContent = `已加载 ${allModels.size} 个模型（线上+本地），可直接输入或从下拉建议中选择`;
                hint.style.color = '#28a745';
                
            } catch (error) {
                hint.textContent = '获取模型列表失败: ' + error.message + '，您仍可手动输入模型名称';
                hint.style.color = '#dc3545';
            }
        }
        
        // 【调用者】配置页"刷新模型"按钮（HTML onclick="refreshModels()"）
        // 【功能】重新加载线上和本地模型列表
        // 【调用】loadModels()
        async function refreshModels() {
            await loadModels();
        }
        
        // 【调用者】showTab('config')切换到配置页时
        // 【功能】从后端加载当前系统配置并填充到表单
        // 【调用API】GET /api/config
        // 【填充】top_k、temperature、llm_api_base、llm_model_name、embedding_model_name
        async function loadConfig() {
            try {
                const response = await fetch(`${API_BASE}/config`);   // 获取配置
                const config = await response.json();
                
                document.getElementById('top_k').value = config.top_k;             // 设置top_k
                document.getElementById('temperature').value = config.temperature; // 设置温度
                document.getElementById('llm_api_base').value = config.llm_api_base; // 设置API地址
                
                const modelSelect = document.getElementById('llm_model_name');
                modelSelect.value = config.llm_model_name;                         // 设置模型名
                
                document.getElementById('llm_api_key').value = '';                 // 清空密钥输入框（安全考虑）
                
                if (config.embedding_model_name) {                                 // 更新向量化模型显示
                    document.getElementById('embedding-model-display').textContent = config.embedding_model_name;
                }
                
                document.getElementById('current-config').textContent = JSON.stringify(config, null, 2);  // 显示完整配置
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }
        
        // 【调用者】配置页"保存配置"按钮（HTML onclick="saveConfig()"）
        // 【功能】将表单配置发送到后端保存（运行时动态更新RAG引擎）
        // 【调用API】PUT /api/config（Content-Type: application/json）
        // 【参数】top_k、temperature、llm_api_base、llm_api_key、llm_model_name
        // 【返回】{success, message}
        async function saveConfig() {
            const config = {                                             // 构建配置对象
                top_k: parseInt(document.getElementById('top_k').value) || 3,
                temperature: parseFloat(document.getElementById('temperature').value) || 0.7,
                llm_api_base: document.getElementById('llm_api_base').value || '',
                llm_model_name: document.getElementById('llm_model_name').value || ''
            };
            
            const apiKeyInput = document.getElementById('llm_api_key').value.trim();
            if (apiKeyInput) {                                          // 输入了密钥就发送新密钥
                config.llm_api_key = apiKeyInput;
            } else {                                                    // 输入框为空时发送__KEEP__标记保持原有密钥
                config.llm_api_key = '__KEEP__';
            }
            
            const alert = document.getElementById('config-alert');
            
            try {
                const response = await fetch(`${API_BASE}/config`, {     // 发送保存请求
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert.className = 'alert success';
                    alert.textContent = result.message;
                    alert.style.display = 'block';
                    document.getElementById('current-config').textContent = JSON.stringify(result.config, null, 2);
                } else {
                    alert.className = 'alert error';
                    alert.textContent = result.detail || '保存失败';
                    alert.style.display = 'block';
                }
            } catch (error) {
                alert.className = 'alert error';
                alert.textContent = '保存失败: ' + error.message;
                alert.style.display = 'block';
            }
        }
        
        // 【调用者】配置页"测试连接"按钮（HTML onclick="testModel()"）
        // 【功能】测试大模型API连接是否正常
        // 【调用API】POST /api/test-model
        // 【参数】question（固定：'请回复"连接成功"'）；api_base；api_key；model_name
        // 【返回】{success, model_name, answer} 或 {success: false, error}
        async function testModel() {
            const testQuestion = document.getElementById('test-question')?.value || '请介绍一下你自己';
            const apiBase = document.getElementById('llm_api_base').value;    // API地址
            const apiKey = document.getElementById('llm_api_key').value;      // API密钥
            const modelName = document.getElementById('llm_model_name').value; // 模型名称
            
            if (!apiBase || !modelName) {                                    // 验证必填字段
                const alert = document.getElementById('config-alert');
                alert.className = 'alert error';
                alert.textContent = '请先填写API地址和模型名称';
                alert.style.display = 'block';
                return;
            }
            
            const loading = document.getElementById('test-loading');          // 加载动画元素
            const resultDiv = document.getElementById('test-result');         // 结果显示元素
            const alert = document.getElementById('config-alert');
            
            alert.style.display = 'none';
            resultDiv.className = 'test-result';
            resultDiv.style.display = 'none';
            loading.classList.add('show');                                   // 显示加载状态
            
            try {
                const response = await fetch(`${API_BASE}/test-model`, {     // 发送测试请求
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: '请回复"连接成功"',
                        api_base: apiBase,
                        api_key: apiKey,
                        model_name: modelName
                    })
                });
                
                const result = await response.json();
                loading.classList.remove('show');                    // 隐藏加载状态
                
                resultDiv.style.display = 'block';
                
                if (result.success) {                               // 测试成功
                    resultDiv.className = 'test-result success show';
                    resultDiv.innerHTML = `
                        <div class="label">✅ 模型连接成功！</div>
                        <div class="label">模型: ${result.model_name}</div>
                        <div class="label">模型回答:</div>
                        <div class="content">${result.answer}</div>
                    `;
                } else {                                           // 测试失败
                    resultDiv.className = 'test-result error show';
                    resultDiv.innerHTML = `
                        <div class="label">❌ 模型连接失败</div>
                        <div class="label">错误信息:</div>
                        <div class="content">${result.error || '未知错误'}</div>
                    `;
                }
            } catch (error) {                                      // 请求异常
                loading.classList.remove('show');
                resultDiv.className = 'test-result error show';
                resultDiv.innerHTML = `
                    <div class="label">❌ 请求失败</div>
                    <div class="content">${error.message}</div>
                `;
            }
        }

        // 【调用者】浏览器DOMContentLoaded事件（页面加载完成时）
        // 【功能】页面加载完成后自动加载已上传文件列表和配置信息
        document.addEventListener('DOMContentLoaded', () => {
            loadUploadedFiles();                                   // 加载已上传文件列表
            loadConfig();                                          // 加载配置信息（用于显示向量模型）
        });
    </script>
</body>
</html>
